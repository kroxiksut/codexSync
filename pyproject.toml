[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codexsync"
version = "0.2.0"
description = "Local-first Codex state sync utility"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "codexSync contributors" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["codex", "sync", "backup", "cli", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control",
  "Topic :: Utilities",
]
dependencies = []

# The core and the CLI have no runtime dependencies and must keep none. The GUI
# is a second shell over the same core, so it is an extra: `pip install
# codexsync` never pulls Qt, and removing PySide6 leaves every command working.
[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/kroxiksut/codexSync"
Repository = "https://github.com/kroxiksut/codexSync"
Issues = "https://github.com/kroxiksut/codexSync/issues"

[project.scripts]
codexsync = "codexsync.cli:main"
codexsync-gui = "codexsync.gui.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
codexsync = ["config.example.toml", "gui/locale/*.json", "gui/resources/*"]

[tool.setuptools.packages.find]
where = ["src"]

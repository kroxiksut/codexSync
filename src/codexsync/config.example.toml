# codexSync - example configuration
# All comments in this file are in English.

[identity]
# Stable machine ID (set manually; do not generate a new random value on each run)
machine_id = "machine-a"

[sync]
# Sync mode: cold only (Codex must be closed)
mode = "cold"
# Direction: bidirectional sync based on mtime
direction = "bidirectional"
# Comparison algorithm: mtime|mtime_hash_fallback
# mtime_hash_fallback compares SHA-256 when size+mtime are equal/close
compare = "mtime"
# Time tolerance (seconds) to smooth small filesystem timestamp differences
time_tolerance_seconds = 0
# Action when mtimes are equal (within tolerance):
# skip|prefer_local|prefer_cloud|manual_abort
equal_mtime_action = "skip"
# Do not propagate deletions (safe mode)
delete_policy = "never"
# Enable dry-run by default
dry_run_default = true
# Session mode:
# all|last_date_only (latest date folder under sessions/, if date-based layout is detected)
# Keep "all": last_date_only can discard branches, so every mutation command
# (sync/restore/repair-projects apply/recover) rejects it with exit code 4.
session_mode = "all"

[paths]
# codexSync workspace root (used for variable expansion in other paths)
workspace_root_dir = "D:/GDrive/codexSync"
# Local Codex state directory
local_state_dir = "C:/Users/USERNAME/.codex"
# Shared cloud/network directory (example path)
cloud_root_dir = "${workspace_root}/sync"
# Directory for backups created before overwrite
backup_dir = "${workspace_root}/backups"
# Temporary directory for atomic operations (tmp + rename)
temp_dir = "${workspace_root}/.tmp"

[guardian]
# Immutable Guardian snapshots. Must stay outside .codex, sync, backups and temp.
root_dir = "${workspace_root}/guardian"
# Maximum accepted .codex-global-state.json size (1 MiB to 1 GiB).
max_state_bytes = 67108864
# Suspicion threshold for a verified state-count reduction.
shrink_min_count = 2
shrink_ratio = 0.25
# Independent retention limits; 0 disables the corresponding limit.
retention_days = 30
max_snapshots = 100
quarantine_retention_days = 30
staging_retention_hours = 24
poll_interval_seconds = 3
debounce_seconds = 2
stable_reads = 3
stable_read_interval_seconds = 0.5
fallback_scan_seconds = 60
once_timeout_seconds = 120

[semantic]
# Immutable semantic publications; may be placed in a user-managed cloud folder.
root_dir = "${workspace_root}/semantic"
max_jsonl_line_bytes = 67108864
# Container the cloud mirror stores a session branch in: none|gzip|xz.
# Only the mirror is affected; a branch written back into the Codex state
# directory is always plain JSONL. Branch hashes, record counts and every
# comparison are taken from the decompressed stream, so a compressed mirror
# copy is the same branch as the plain one rather than a divergence.
# Changing this renames every mirror destination and so changes the plan id:
# rescan and confirm the new id before applying.
mirror_compression = "xz"

[targets]
# Relative paths under local_state_dir/cloud_state_dir included in sync
include_roots = [
  "sessions",
  "session_index.jsonl",
  "skills",
  "plugins",
]

[filters]
# Global exclusions (temporary/cache/lock files, etc.)
# "skills/.system/**": those skills are installed and removed by the Codex
# runtime itself. With delete_policy = "never" a file it deleted there would
# come back from the mirror on every run, so that tree is left to it entirely.
exclude_globs = [
  "**/*.lock",
  "**/*.tmp",
  "**/*.temp",
  "**/tmp/**",
  "**/cache/**",
  "**/.cache/**",
  "**/__pycache__/**",
  "**/*.log",
  "skills/.system/**",
]

[conflict]
# Conflict policy:
# manual_abort|prefer_cloud|prefer_local|prefer_newer_mtime
policy = "manual_abort"
# Include conflict file list in report
report_conflicts = true

[backup]
# Create backup before any target file overwrite
backup_before_overwrite = true
# Backup retention period (days)
retention_days = 30
# Maximum number of backup archives/directories (0 = unlimited)
max_backups = 0
# Backup compression: none|zip
compression = "none"

[safety]
# Never write state while Codex is running
require_codex_stopped = true
# On uncertainty, abort with error (safe fail)
fail_on_unknown = true

[process_detection]
# Codex process names across operating systems. Matched as whole process
# names, never as substrings. On Linux `ps` cuts a name to 15 characters and
# the detector compares the truncation too.
process_names = ["codex.exe", "codex", "codex-app-server"]
# Small grace delay after process close before sync starts
grace_period_seconds = 2
# Allow automatic Codex process termination before sync (Windows only)
allow_terminate_if_running = false
# Require manual GUI confirmation before termination by default
manual_terminate_confirmation = true
# Confirmation channel: gui|console
terminate_confirmation_mode = "gui"
# Timeout waiting for full termination after terminate call (seconds)
terminate_timeout_seconds = 20

[process_detection.background_process_names]
# Background processes treated as "Codex is still running".
# An entry containing "/" is a path marker matched against the process path
# instead of its name: the macOS desktop build is called ChatGPT since
# 2026-07-09 (bundle id com.openai.codex), and a bare "ChatGPT" would also
# match the ordinary ChatGPT app, which has nothing to do with Codex.
# A name here must disappear when Codex closes. "codex-windows-sandbox-service"
# is deliberately absent: on Windows it is the always-running service
# CodexSandboxService.OpenAI.Codex, so listing it blocked every mutation.
windows = [
  "codex-windows-sandbox",
  "codex-windows-sandbox-setup",
  "codex-command-runner",
]
macos = [
  "ChatGPT.app/Contents/MacOS/",
  "codex-app-server",
  "codex-execve-wrapper",
  "codex-code-mode-host",
]
linux = [
  "/usr/lib/chatgpt/",
  "codex-app-server",
  "codex-linux-sandbox",
  "codex-execve-wrapper",
  "codex-code-mode-host",
]

[state]
# Internal coordination files between machines
manifest_file = "${workspace_root}/state/manifest.json"
#lease_file = "D:/GDrive/codexSync/lease.json"
#history_dir = "D:/GDrive/codexSync/history"
# Lease TTL (seconds): once expired, another machine may take over sync
#lease_ttl_seconds = 300
# Internal metadata schema version
data_version = 1

[scheduler]
# Periodic safe work, registered as a user-level task of the operating system
# (Task Scheduler on Windows, launchd on macOS, systemd --user on Linux).
# Manual runs are always available.
enabled = false
# Safe job only: guardian_snapshot|preflight|sync_dry_run.
# Mutating operations are deliberately not valid scheduler modes.
mode = "guardian_snapshot"
# Repeat interval; must be at least 60 seconds.
interval_seconds = 60
# Run the user-level job after the user signs in / user session starts.
run_at_login = true
# Optional delay after sign-in or session start; avoids competing with startup.
startup_delay_seconds = 0
# Random delay before a regular run; 0 disables it.
jitter_seconds = 0
# Sync settings once after signing in, in a separate task (off by default).
# This is `sync --apply --unattended`: refused while Codex is open, and any
# conflict stops it before a write, whatever conflict.policy says. It waits
# startup_delay_seconds after sign-in. Session transfer, restore and repair
# are never scheduled.
sync_at_login = false

[logging]
# Logging level: DEBUG|INFO|WARNING|ERROR
level = "INFO"
# Base log file path template (real files include machine + date suffix)
# Example real name: codexsync-machine-a-2026-03-21.log
file = "${workspace_root}/logs/codexsync.log"
# Log format: text|json|logfmt
format = "text"
# Log retention period (days)
retention_days = 7
# Archive mode for rotated/old logs: text|zip
archive_mode = "zip"
# Maximum size per active text log file (MB)
max_file_size_mb = 10

[assumptions]
# IMPORTANT: this defines the project's operational contract.
# 1) Close Codex on machine A
# 2) Wait for cloud synchronization to finish
# 3) Run sync on machine B
# Cloud client state and free-space checks are NOT performed by this tool.
strict_handoff_required = true
cloud_readiness_is_user_responsibility = true
cloud_capacity_is_user_responsibility = true

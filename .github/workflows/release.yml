name: Release

# Manual on purpose: a release uploads to PyPI, where a version number can be
# used only once, and attaches Windows builds to a GitHub release. Push the tag
# first, then run this workflow with it. Steps, and the one-time PyPI setup:
# docs/dev/PUBLISHING.md.
#
# A rehearsal before tagging: give `ref: main` and leave both publishing
# switches off -- everything is checked, tested and built, and the builds are
# downloadable from the run. Nothing is published from anything but the tag.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to release, already pushed (v0.2.0-alpha.1, v0.2.0)"
        required: true
        type: string
      ref:
        description: "Build this branch or commit instead of the tag (a rehearsal; publishes nothing)"
        required: false
        default: ""
        type: string
      publish_pypi:
        description: "Upload the wheel and sdist to PyPI (cannot be undone: a version is uploaded once)"
        required: true
        default: false
        type: boolean
      publish_npm:
        description: "Publish the npm packages (cannot be undone: a version is published once)"
        required: true
        default: false
        type: boolean
      github_release:
        description: "Create the GitHub release with the builds attached"
        required: true
        default: true
        type: boolean
      draft:
        description: "Create the GitHub release as a draft, to read it before anyone sees it"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
  # Everything else waits for this: the tag must mean the version pyproject.toml
  # declares, and CHANGELOG.md must have a dated section for it.
  meta:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag, pyproject.toml and CHANGELOG.md agree
        run: python scripts/release_meta.py check --tag "$RELEASE_TAG"
      - id: meta
        run: python scripts/release_meta.py outputs --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Release notes
        run: python scripts/release_meta.py notes --tag "$RELEASE_TAG" --out release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  # One wheel and one sdist for every platform: the package is pure Python.
  dist:
    name: Wheel and sdist
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pin README links to the tag (PyPI shows the file without the repository)
        run: python scripts/release_meta.py pypi-readme --tag "$RELEASE_TAG"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - name: The wheel installs with no dependency and reports its version
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          test "$(/tmp/wheel-check/bin/pip list --format=freeze | grep -vi '^codexsync=' | grep -vi '^pip=' | wc -l)" = "0"
          test "$(/tmp/wheel-check/bin/codexsync --version)" = "codexsync ${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  # Portable builds, for the two architectures Codex itself is published for
  # (x64 and ARM64; there is no 32-bit Codex, so a 32-bit build would have
  # nothing to sync). Each build runs the suite with its own interpreter first:
  # arm64 is not in the everyday CI matrix.
  exe:
    name: Windows ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
            python_arch: x64
            gui: true
          - arch: arm64
            runner: windows-11-arm
            python_arch: arm64
            gui: true
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python_arch }}
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ("${{ matrix.gui }}" -eq "true") { pip install -e ".[gui]" pytest pyinstaller }
          else { pip install -e . pytest pyinstaller }
      - name: Test suite
        run: python -m pytest -q
      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm codexsync.spec
          if ("${{ matrix.gui }}" -eq "true") { python -m PyInstaller --clean --noconfirm codexsync-gui.spec }
      - name: Check the builds
        shell: pwsh
        run: |
          $expected = "codexsync ${{ needs.meta.outputs.version }}"
          $actual = (& dist/codexsync.exe --version).Trim()
          if ($actual -ne $expected) { Write-Error "codexsync.exe reports '$actual', expected '$expected'"; exit 1 }
          $exes = @("dist/codexsync.exe")
          if ("${{ matrix.gui }}" -eq "true") { $exes += "dist/codexsync-gui.exe" }
          python scripts/check_exe_version.py @exes
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Pack
        shell: pwsh
        run: |
          $builds = @(@{ Exe = "codexsync.exe"; Zip = "codexsync-$env:RELEASE_TAG-windows-${{ matrix.arch }}.zip" })
          if ("${{ matrix.gui }}" -eq "true") {
            $builds += @{ Exe = "codexsync-gui.exe"; Zip = "codexsync-gui-$env:RELEASE_TAG-windows-${{ matrix.arch }}.zip" }
          }
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($build in $builds) {
            Compress-Archive -Path "dist/$($build.Exe)", LICENSE -DestinationPath "release/$($build.Zip)" -Force
            $hash = (Get-FileHash "release/$($build.Zip)" -Algorithm SHA256).Hash.ToLower()
            "$hash  $($build.Zip)" | Out-File -FilePath "release/$($build.Zip).sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*

  # The Linux build (D-037, CS-421): one folder with both programs, packed as
  # tar.gz, AppImage, .deb and .rpm. Built on the oldest system the PySide6 the
  # Windows builds use can run on: glibc 2.35 (Ubuntu 22.04) for x64, 2.39
  # (Ubuntu 24.04) for ARM64, whose PySide6 wheels need nothing older. The
  # suite runs first with the interpreter the build is made from.
  linux:
    name: Linux ${{ matrix.arch }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      # Even offscreen, Qt loads EGL, xkbcommon, fontconfig and D-Bus.
      - name: Qt libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]" pytest pyinstaller
      - name: Test suite
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --clean --noconfirm codexsync-linux.spec
      - name: Check the builds
        run: |
          expected="codexsync ${{ needs.meta.outputs.version }}"
          for program in dist/codexsync/codexsync dist/codexsync/codexsync-gui; do
            actual="$("$program" --version)"
            test "$actual" = "$expected" || { echo "$program reports '$actual', expected '$expected'"; exit 1; }
          done
      - name: Pack
        run: python scripts/linux_packages.py --tag "$RELEASE_TAG" --dist dist/codexsync --out release
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*

  # Each file installed on a clean system of the family it is for, as a person
  # would: version, every library resolved (`ldd`), the window starts, and a
  # .deb/.rpm removes cleanly without having touched any home directory.
  linux-check:
    name: Linux ${{ matrix.arch }} on clean systems
    needs: [meta, linux]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # The oldest system the build is made for (see the `linux` job).
            oldest: ubuntu:22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
            oldest: ubuntu:24.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
          sparse-checkout: scripts/linux_package_check.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release
      - name: .deb on Ubuntu 24.04
        run: docker run --rm -v "$PWD:/w" ubuntu:24.04 sh /w/scripts/linux_package_check.sh deb /w/release/codexsync-$RELEASE_TAG-linux-${{ matrix.arch }}.deb "$VERSION"
      - name: .rpm on Fedora 43
        run: docker run --rm -v "$PWD:/w" fedora:43 sh /w/scripts/linux_package_check.sh rpm /w/release/codexsync-$RELEASE_TAG-linux-${{ matrix.arch }}.rpm "$VERSION"
      - name: AppImage on Ubuntu 24.04
        run: docker run --rm -v "$PWD:/w" ubuntu:24.04 sh /w/scripts/linux_package_check.sh appimage /w/release/codexsync-$RELEASE_TAG-linux-${{ matrix.arch }}.AppImage "$VERSION"
      - name: tar.gz on the oldest system it is built for
        run: docker run --rm -v "$PWD:/w" ${{ matrix.oldest }} sh /w/scripts/linux_package_check.sh tarball /w/release/codexsync-$RELEASE_TAG-linux-${{ matrix.arch }}.tar.gz "$VERSION"

  # The same builds as npm packages (CS-416): a launcher plus one package per
  # system, each holding the release build unchanged. See scripts/npm_packages.py.
  npm:
    name: npm packages
    needs: [meta, exe, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux}-*"
          path: assets
          merge-multiple: true
      - name: Stage and pack
        run: python scripts/npm_packages.py stage --tag "$RELEASE_TAG" --assets assets --out npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: npm/*.tgz

  # Installed as a person would, on each system a package is for: the launcher
  # finds its program, and both programs report the version.
  npm-check:
    name: npm on ${{ matrix.key }}
    needs: [meta, npm]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: win32-x64
            runner: windows-latest
          - key: win32-arm64
            runner: windows-11-arm
          - key: linux-x64
            runner: ubuntu-latest
          - key: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - name: Install and run
        shell: bash
        run: |
          launcher="$(ls npm/codexsync-*.tgz | grep -Ev -- '-(win32|linux)-(x64|arm64)\.tgz$')"
          npm install -g "./$launcher"
          npm install -g "codexsync-${{ matrix.key }}@file:./$(ls npm/codexsync-*-${{ matrix.key }}.tgz)"
          for program in codexsync codexsync-gui; do
            actual="$("$program" --version)"
            test "$actual" = "codexsync $VERSION" || { echo "$program reports '$actual', expected 'codexsync $VERSION'"; exit 1; }
          done

  # Platform packages first, the launcher last; a version npm already holds is
  # skipped, so a failed run can be repeated. Trusted publishing (OIDC); the
  # NPM_TOKEN secret is only for the very first publish, before npm knows the
  # package (docs/dev/PUBLISHING.md).
  npm-publish:
    name: Publish to npm
    needs: [meta, dist, exe, linux, linux-check, npm, npm-check]
    if: ${{ inputs.publish_npm && inputs.ref == '' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/codexsync
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          sparse-checkout: |
            scripts/npm_packages.py
            scripts/release_meta.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: npm
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          python scripts/npm_packages.py publish --tag "$RELEASE_TAG" --dir npm

  # Only after every build above succeeded, so PyPI never holds a version whose
  # Windows or Linux builds failed. Trusted publishing: no token is stored anywhere.
  pypi:
    name: Publish to PyPI
    needs: [meta, dist, exe, linux, linux-check]
    if: ${{ inputs.publish_pypi && inputs.ref == '' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/codexsync/${{ needs.meta.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: [meta, dist, exe, linux, linux-check]
    if: ${{ inputs.github_release && inputs.ref == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      # GitHub's own CLI rather than a third-party action: this job can write
      # to the repository, so it runs nothing that is not GitHub's or ours.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          if [ "$DRAFT" = "true" ]; then flags+=(--draft); fi
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "codexSync $RELEASE_TAG" \
            --notes-file assets/release-notes/release-notes.md \
            "${flags[@]}" \
            assets/windows-*/* assets/linux-*/* assets/python-dist/*
